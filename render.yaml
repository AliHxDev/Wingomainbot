services:
  - type: web
    name: wingo-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: wingo-backend-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wingo-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: PAIRING_WAIT_MS
        value: "25000"
      - key: DATA_DIR
        value: /var/data
      - key: JSON_DB_PATH
        value: /var/data/backend-db.json
      - key: LOG_LEVEL
        value: info

  - type: worker
    name: wingo-worker
    runtime: node
    rootDir: bot-worker
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: wingo-worker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wingo-db
          property: connectionString
      - key: AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: JSON_DB_PATH
        value: /var/data/wingo-db.json
      - key: DATA_DIR
        value: /var/data
      - key: WINGO_API_URL
        value: https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json
      - key: WINGO_HTTP_TIMEOUT_MS
        value: "12000"
      - key: WINGO_HTTP_RETRIES
        value: "3"
      - key: SIGNAL_LOOP_MS
        value: "60000"
      - key: PAIRING_POLL_MS
        value: "1000"
      - key: CHANNEL_SEND_RETRIES
        value: "3"
      - key: RECONNECT_COOLDOWN_MS
        value: "5000"
      - key: LOG_LEVEL
        value: info
      - key: BAILEYS_LOG_LEVEL
        value: silent

databases:
  - name: wingo-db
    plan: free
